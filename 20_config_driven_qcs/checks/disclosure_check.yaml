# disclosure_check -- llm_infer's output is free text, not a value to
# compare, so there's nothing to aggregate -- pass/fail itself needs
# judgment. That's what the `verdict` block is for: one extra LLM call,
# opt-in per check, only paid by checks that actually need it.

params: [doc_id, section]
steps:
  - {tool: get_pdf_section, args: {doc_id: "$doc_id", section: "$section"}, save_as: section_data}
  - {tool: llm_infer, args: {text: "section_data.text", instructions: "Does this adequately disclose supply chain risk -- specifically dependency on single-source suppliers and risk of sourcing disruption? It does not need to use the exact phrase 'supply chain', but must substantively describe these risks."}, save_as: analysis}
verdict:
  instructions: "Based on the evidence gathered, render a pass/fail verdict on whether the disclosure is adequate, with reasoning."
