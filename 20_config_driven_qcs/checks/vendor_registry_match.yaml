params:
- vendor_id
steps:
- tool: query_database
  args:
    key: $vendor_id
  save_as: internal_vendor
- tool: call_api
  args:
    key: $vendor_id
  save_as: external_vendor
- compare:
  - internal_vendor.legal_name
  - external_vendor.legal_name
- compare:
  - internal_vendor.status
  - external_vendor.status
