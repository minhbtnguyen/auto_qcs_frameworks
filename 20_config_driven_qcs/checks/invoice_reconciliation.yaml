# invoice_reconciliation -- the pure-compare shape: every step is either a
# tool call or a comparison, and pass/fail is fully determined by whether
# every comparison matched -- computed in code, zero LLM calls for
# orchestration (read_pdf still makes one LLM call internally, but that's
# extraction needing judgment, not the engine deciding what to do next).

params: [invoice_id]
steps:
  - {tool: read_pdf, args: {doc_id: "$invoice_id"}, save_as: pdf}
  - {tool: query_database, args: {key: "$invoice_id"}, save_as: db}
  - {compare: [pdf.vendor, db.vendor]}
  - {compare: [pdf.total, db.total]}
